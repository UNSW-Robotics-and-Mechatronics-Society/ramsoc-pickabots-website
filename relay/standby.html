:root {
  --bg: #06080b;
  --fg: #f4f7fb;
  --std: #FF6B00;
  --gold: #FFD700;
}
* { margin: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4vh;
  font-family: 'Audiowide', system-ui, sans-serif;
  color: var(--fg);
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(255,107,0,0.12), transparent 70%),
    radial-gradient(ellipse 90% 80% at 50% 110%, rgba(255,215,0,0.06), transparent 60%),
    var(--bg);
}
/* Decorative sumo ring */
.ring {
  position: fixed; left: 50%; top: 56%; transform: translate(-50%, -50%);
  width: 68vw; height: 68vw;
  border: 2px solid rgba(244,247,251,0.05);
  border-radius: 50%;
  pointer-events: none;
}
.ring::before {
  content: ''; position: absolute; inset: 10%;
  border: 1px solid rgba(244,247,251,0.07);
  border-radius: 50%;
}
.wordmark {
  font-size: 8vw; line-height: 1; letter-spacing: 0.12em;
  text-shadow: 0 0 60px rgba(255,107,0,0.35), 0 4px 18px rgba(0,0,0,0.8);
}
.year {
  font-size: 2.8vw; letter-spacing: 0.55em; padding-left: 0.55em;
  color: var(--gold);
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  text-align: center;
}
.back {
  display: flex; align-items: center; gap: 1.2vw;
  font-size: 1.4vw; letter-spacing: 0.45em; padding-left: 0.45em;
  text-transform: uppercase; color: rgba(244,247,251,0.8);
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(6,8,11,0.7);
  padding: 1.2vh 2.6vw; border-radius: 999px;
}
.dot { color: var(--std); }
@media (prefers-reduced-motion: no-preference) {
  .dot { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .ring { animation: spin 240s linear infinite; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
}
</style>
</head>
<body>
  <div class="ring" aria-hidden="true"></div>
  <div class="wordmark">SUMOBOTS</div>
  <div class="year">2026</div>
  <div class="back"><span class="dot">●</span> We&rsquo;ll be back shortly</div>
</body>
</html>
